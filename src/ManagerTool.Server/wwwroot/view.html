<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live view</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#cfd8e3;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:5px 10px;
       background:rgba(10,14,20,.72);font-size:.8rem;z-index:2;transition:opacity .3s}
  #bar.hide{opacity:0}
  #label{font-weight:600}
  #status{color:#8b97a5}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #img{max-width:100%;max-height:100%;object-fit:contain}
  #hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6b7684;text-align:center;padding:20px}
</style>
</head>
<body>
  <div id="bar">
    <span id="label">Live view</span>
    <span id="status">connecting…</span>
    <span style="flex:1"></span>
    <span style="color:#6b7684">Drag this window to any monitor · double-click = full screen</span>
  </div>
  <div id="wrap"><canvas id="img" aria-label="live screen" style="display:none"></canvas></div>
  <div id="hint">Waiting for the main dashboard to send frames.<br/><small>Keep the main Manager Tool tab open — it feeds this window.</small></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.hash.slice(1));
  const host = params.get("h");
  const label = params.get("label") || host || "Live view";
  document.title = label + " — live";
  $("label").textContent = label;

  if (!host || !("BroadcastChannel" in window)) {
    $("status").textContent = "unavailable";
    $("hint").textContent = "This window must be opened from the Wall view in the main dashboard.";
    return;
  }

  const chan = new BroadcastChannel("mt-wall");
  let seen = false, lastSeen = 0, revoked = false;

  // Ask the main window to start streaming this host (ref-counted there).
  chan.postMessage({ t: "want", host });

  chan.onmessage = (e) => {
    const m = e.data || {};
    if (m.t === "revoked" && m.host === host) {
      $("img").style.display = "none";
      $("hint").style.display = "";
      $("hint").textContent = "Access to this workstation was withdrawn.";
      $("status").textContent = "";
      revoked = true;
      return;
    }
    if (m.host !== host) return;

    const canvas = $("img");
    const ctx = canvas.getContext("2d");
    if (m.t === "frame") {
      if (m.mi !== undefined && m.mi !== 0) return;    // primary monitor only
      const img = new Image();
      img.onload = () => {
        if (canvas.width !== m.w || canvas.height !== m.h) { canvas.width = m.w; canvas.height = m.h; }
        ctx.drawImage(img, 0, 0, m.w, m.h);
      };
      img.src = "data:image/jpeg;base64," + m.jpeg;
    } else if (m.t === "tiles") {
      const f = m.frame;
      if (f.monitorIndex !== undefined && f.monitorIndex !== 0) return;
      if (f.keyframe && (canvas.width !== f.frameWidth || canvas.height !== f.frameHeight)) {
        canvas.width = f.frameWidth; canvas.height = f.frameHeight;
      }
      for (const t of f.tiles) {
        const col = t.index % f.cols, row = (t.index / f.cols) | 0;
        const x = col * f.tileSize, y = row * f.tileSize;
        const img = new Image();
        img.onload = () => ctx.drawImage(img, x, y);
        img.src = "data:image/jpeg;base64," + t.jpegBytes;
      }
    } else {
      return;
    }

    canvas.style.display = "";
    $("hint").style.display = "none";
    lastSeen = Date.now();
    if (!seen) { seen = true; $("status").textContent = ""; }
  };

  // Stale detector: if frames stop (main tab closed, host offline), say so.
  setInterval(() => {
    if (!revoked && seen && Date.now() - lastSeen > 6000) {
      $("status").textContent = "no signal — is the main dashboard open and the PC online?";
    }
  }, 2000);

  // Tell the main window we're gone so it can stop streaming if nothing else wants it.
  window.addEventListener("beforeunload", () => {
    chan.postMessage({ t: "unwant", host });
  });

  // UX: auto-hide the top bar; double-click toggles full screen.
  let hideT;
  const showBar = () => { $("bar").classList.remove("hide"); clearTimeout(hideT); hideT = setTimeout(() => $("bar").classList.add("hide"), 2500); };
  document.addEventListener("mousemove", showBar); showBar();
  document.addEventListener("dblclick", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });
})();
</script>
</body>
</html>
