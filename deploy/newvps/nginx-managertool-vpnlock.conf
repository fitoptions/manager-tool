# Install to: /etc/nginx/sites-available/managertool  (then symlink into sites-enabled)
# VARIANT B — agent endpoints public, admin dashboard + admin API locked to your NordVPN
# dedicated IP. Apply this AFTER Variant A is proven working and you have NORD_IP.
#
# Replace APP_DOMAIN with your host, and NORD_IP with your NordVPN dedicated IP.
#
# NOTE ON CLOUDFLARE (Phase 9): if you proxy this host through Cloudflare (orange cloud),
# $remote_addr becomes a Cloudflare IP and `allow NORD_IP` will DENY everyone. To combine
# both, uncomment the real_ip block below (restores the true client IP from CF-Connecting-IP)
# and keep the Cloudflare IP list current. Otherwise keep the admin host DNS-only (grey cloud).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name your-server.example.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-server.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    client_max_body_size 20m;

    # --- OPTIONAL: only if Cloudflare is in front (see note above) ---
    # set_real_ip_from 173.245.48.0/20;   # ... plus every Cloudflare range
    # real_ip_header CF-Connecting-IP;

    # ---- PUBLIC: office agents must reach these from any IP ----
    location = /health           { include snippets/mt-proxy.conf; }
    location /hub                 { include snippets/mt-proxy.conf; }   # SignalR (authenticated)
    location = /api/auth/enroll   { include snippets/mt-proxy.conf; }
    location /api/agent/          { include snippets/mt-proxy.conf; }   # /version + /installer (bearer)
    location /dl/                 { include snippets/mt-proxy.conf; }   # basic-auth agent download

    # ---- ADMIN-ONLY: dashboard SPA + all admin APIs (login, hosts, rules, alerts,
    #      audit, reports, recordings, admins, settings, request-access) ----
    location / {
        allow NORD_IP;
        deny all;
        include snippets/mt-proxy.conf;
    }
}
