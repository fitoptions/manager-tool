# Install to: /etc/nginx/sites-available/managertool  (then symlink into sites-enabled)
# VARIANT A — everything public (simplest). Use this first to prove the app works,
# then switch to the -vpnlock variant once NordVPN dedicated IP is ready.
#
# Replace APP_DOMAIN with your real host (e.g. app.example.com).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name your-server.example.com;
    # http -> https. (Requires ufw to allow 80; optional — all clients use https anyway.)
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-server.example.com;

    # Wildcard cert from Phase 6. certbot names the live dir after the FIRST -d argument.
    # If you issued  -d "*.example.com" -d "example.com"  the dir is  example.com.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    client_max_body_size 20m;

    location / {
        include snippets/mt-proxy.conf;
    }
}
